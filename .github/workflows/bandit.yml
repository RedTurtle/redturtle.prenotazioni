name: Security check - Bandit

on: push

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: read
    steps:
      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@7925d472505a4ec09ef471b22fe99c26fee47443  # main (adds python-version input; v1.0.x hardcode old Python)
        with:
            targets: ./src
            python-version: '3.11'

