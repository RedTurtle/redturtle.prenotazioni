[tox]
envlist =
    py{27,36,37,38}-plone52,
    py{38,39,310,311,312}-plone60,
    py{311,312}-plone61,
skip_missing_interpreters = True

[coverage:run]
relative_files = True

[testenv]
skip_install = true
extras =
    test
commands_pre =
    {envbindir}/buildout -c {toxinidir}/{env:version_file} buildout:directory={envdir} buildout:develop={toxinidir} install test coverage
# NB: usiamo "python -m coverage" (coverage installato via pip in [testenv]deps,
# con estensione C) invece di {envbindir}/coverage generato da buildout, che
# installa la wheel pure-Python (py3-none-any) senza tracer C: su Python 3.11
# (dove sys.monitoring non e' disponibile) quello ricade su pytrace, ~10x piu' lento.
commands =
    python -m coverage run {envbindir}/test
    python -m coverage html
#   TODO: increase coverage
#   python -m coverage report -m --fail-under=85
    python -m coverage report -m --fail-under=40
    python -m coverage json -i
setenv =
    # Su Python 3.12+ usa il core sys.monitoring (il piu' veloce); su 3.11 fa
    # fallback sicuro all'estensione C (vedi coverage in [testenv]deps).
    COVERAGE_CORE=sysmon
    version_file=test-5.2.x.cfg
    py27-plone52: version_file=test-5.2.x-py27.cfg
    plone60: version_file=test-6.0.x.cfg
    plone61: version_file=test-6.1.x.cfg
deps =
    # Coverage con estensione C (pip sceglie la wheel cp3x, non la py3-none-any
    # di buildout). Usato via "python -m coverage" nei commands.
    coverage
    plone52: -rrequirements-5.2.x.txt
    plone60: -rrequirements-6.0.x.txt
    plone61: -rrequirements-6.1.x.txt
